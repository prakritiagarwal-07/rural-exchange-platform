<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 {{ t('app_name') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 1s ease-out forwards; }
        .animate-delay-1 { animation-delay: 0.3s; opacity: 0; }
        .animate-delay-2 { animation-delay: 0.6s; opacity: 0; }
        .animate-delay-3 { animation-delay: 0.9s; opacity: 0; }
        .animate-delay-4 { animation-delay: 1.2s; opacity: 0; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        .pulse-ring { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 via-white to-blue-50 min-h-screen flex items-center justify-center">
    <div class="max-w-4xl mx-auto text-center px-4">
        <div class="animate-fade-in-up animate-delay-1">
            <div class="text-8xl mb-6 pulse-ring">🌾</div>
        </div>
        <h1 class="text-5xl md:text-7xl font-extrabold text-green-700 animate-fade-in-up animate-delay-1">{{ t('app_name') }}</h1>
        <p class="text-xl md:text-2xl text-gray-600 mt-4 animate-fade-in-up animate-delay-2">{{ t('tagline') }}</p>
        <div class="w-24 h-1 bg-green-500 mx-auto mt-6 rounded-full animate-fade-in-up animate-delay-2"></div>
        <p class="text-gray-500 max-w-2xl mx-auto mt-6 text-lg animate-fade-in-up animate-delay-3">{{ t('desc') }}</p>
        <div class="flex flex-wrap justify-center gap-3 mt-6 animate-fade-in-up animate-delay-3">
            <span class="bg-green-100 text-green-800 px-4 py-2 rounded-full text-sm font-medium">🚜 {{ t('machinery') }}</span>
            <span class="bg-yellow-100 text-yellow-800 px-4 py-2 rounded-full text-sm font-medium">🌾 {{ t('crop_residue') }}</span>
            <span class="bg-blue-100 text-blue-800 px-4 py-2 rounded-full text-sm font-medium">📍 {{ t('location') }}</span>
            <span class="bg-purple-100 text-purple-800 px-4 py-2 rounded-full text-sm font-medium">⭐ {{ t('ratings') }}</span>
        </div>
        <div class="mt-10 animate-fade-in-up animate-delay-4">
            <p class="text-gray-400 text-sm">{{ t('redirecting') }} <span id="countdown" class="font-bold text-green-600">5</span> {{ t('seconds') }}</p>
            <div class="w-48 h-1 bg-gray-200 rounded-full mx-auto mt-3 overflow-hidden">
                <div id="progressBar" class="h-full bg-green-500 rounded-full transition-all duration-1000" style="width: 0%;"></div>
            </div>
            <a href="/login" class="inline-block mt-4 text-blue-500 hover:text-blue-700 text-sm underline">{{ t('click_if_not_redirected') }}</a>
        </div>
    </div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        const interval = setInterval(() => {
            seconds -= 1;
            countdownEl.textContent = seconds;
            progressBar.style.width = ((5 - seconds) / 5) * 100 + '%';
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/login';
            }
        }, 1000);
        setTimeout(() => { window.location.href = '/login'; }, 5500);
    </script>
</body>
</html>

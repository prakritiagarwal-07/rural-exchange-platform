{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-yellow-600 mb-6">🚜 {{ t('owner_dashboard') }}</h1>

    <div id="userInfo" class="bg-white p-4 rounded-lg shadow mb-6"></div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Add Machine -->
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
            <h2 class="text-xl font-semibold mb-4">➕ {{ t('add_new_machinery') }}</h2>
            <form id="addMachineForm" class="space-y-3">
                <!-- ... (form fields unchanged, same as before) ... -->
                <input type="text" id="m_name" placeholder="{{ t('machine_name') }}" class="w-full p-2 border rounded-lg" required>
                <input type="text" id="m_category" placeholder="{{ t('category') }}" class="w-full p-2 border rounded-lg" required>
                <input type="number" id="m_price" placeholder="{{ t('rental_price_per_day') }}" step="0.01" class="w-full p-2 border rounded-lg" required>

                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="m_country" placeholder="{{ t('country') }}" class="w-full p-2 border rounded-lg">
                    <input type="text" id="m_state" placeholder="{{ t('state') }}" class="w-full p-2 border rounded-lg">
                    <input type="text" id="m_city" placeholder="{{ t('city') }}" class="w-full p-2 border rounded-lg">
                </div>

                <textarea id="m_address" placeholder="{{ t('address') }} ({{ t('optional') }})" class="w-full p-2 border rounded-lg"></textarea>

                <input type="hidden" id="m_lat">
                <input type="hidden" id="m_lng">

                <div id="geoStatus" class="text-xs text-gray-500 mb-2"></div>

                <button type="button" onclick="fetchCoordinates()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 p-2 rounded-lg transition mb-2">
                    🌍 {{ t('get_coordinates') }}
                </button>

                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white p-2 rounded-lg font-semibold transition">{{ t('add_machine') }}</button>
            </form>
            <div id="addMsg" class="mt-2 text-sm"></div>
        </div>

        <!-- Booking Requests -->
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">📋 {{ t('booking_requests') }}</h2>
                <button onclick="loadOwnerBookings()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">{{ t('refresh') }}</button>
            </div>
            <div id="ownerBookings" class="space-y-3 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <!-- My Machinery (NEW) -->
    <div class="mt-6 bg-white p-6 rounded-xl shadow-lg border border-gray-100">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">🚜 {{ t('my_machinery') }}</h2>
            <button onclick="loadMyMachinery()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">{{ t('refresh') }}</button>
        </div>
        <div id="myMachineryList" class="space-y-3">
            <p class="text-gray-500">{{ t('loading') }}</p>
        </div>
    </div>
</div>

<script>
    // ========== USER INFO ==========
    async function loadUser() {
        const res = await fetch('/api/auth/me');
        if (!res.ok) { window.location.href = '/login'; return; }
        const user = await res.json();
        const container = document.getElementById('userInfo');
        let html = `<p class="font-medium">{{ t('welcome') }}, <span class="text-yellow-600">${user.full_name}</span>!</p>`;
        if (user.role === 'farmer') {
            html += `<a href="/farmer-dashboard" class="inline-block mt-2 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">{{ t('switch_to_farmer') }}</a>`;
        }
        container.innerHTML = html;
    }

    // ========== GEOCODING ==========
    async function fetchCoordinates() {
        const country = document.getElementById('m_country').value.trim();
        const state = document.getElementById('m_state').value.trim();
        const city = document.getElementById('m_city').value.trim();
        const addressDetail = document.getElementById('m_address').value.trim();
        const status = document.getElementById('geoStatus');

        if (!country || !city) {
            status.innerText = t('enter_location');
            status.style.color = 'orange';
            return;
        }

        let query = `${city}, ${state ? state + ', ' : ''}${country}`;
        if (addressDetail) {
            query = `${addressDetail}, ${city}, ${state ? state + ', ' : ''}${country}`;
        }

        status.innerText = t('searching_coords');
        status.style.color = 'blue';

        try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
            const res = await fetch(url);
            const data = await res.json();

            if (data && data.length > 0) {
                document.getElementById('m_lat').value = data[0].lat;
                document.getElementById('m_lng').value = data[0].lon;
                status.innerText = t('coords_found');
                status.style.color = 'green';
                if (!document.getElementById('m_address').value) {
                    document.getElementById('m_address').value = data[0].display_name;
                }
            } else {
                status.innerText = t('coords_not_found');
                status.style.color = 'red';
            }
        } catch (err) {
            status.innerText = t('network_error');
            status.style.color = 'red';
        }
    }

    // ========== ADD MACHINE ==========
    document.getElementById('addMachineForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('addMsg');

        let lat = document.getElementById('m_lat').value;
        let lng = document.getElementById('m_lng').value;
        if (!lat || !lng) {
            await fetchCoordinates();
            lat = document.getElementById('m_lat').value;
            lng = document.getElementById('m_lng').value;
        }

        if (!lat || !lng) {
            msg.innerHTML = `<span class="text-red-600">${t('enter_location')}</span>`;
            return;
        }

        const country = document.getElementById('m_country').value.trim();
        const state = document.getElementById('m_state').value.trim();
        const city = document.getElementById('m_city').value.trim();
        const addressDetail = document.getElementById('m_address').value.trim();
        let address = addressDetail ? `${addressDetail}, ` : '';
        address += `${city}${state ? ', ' + state : ''}${country ? ', ' + country : ''}`;

        const data = {
            name: document.getElementById('m_name').value,
            category: document.getElementById('m_category').value,
            rental_price_per_day: document.getElementById('m_price').value,
            location_lat: parseFloat(lat),
            location_lng: parseFloat(lng),
            address: address
        };

        try {
            const res = await fetch('/api/machinery/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                msg.innerHTML = `<span class="text-green-600">✅ ${result.message}</span>`;
                e.target.reset();
                document.getElementById('m_lat').value = '';
                document.getElementById('m_lng').value = '';
                document.getElementById('geoStatus').innerText = '';
                loadMyMachinery(); // Refresh the list
            } else {
                msg.innerHTML = `<span class="text-red-600">❌ ${result.error || 'Error'}</span>`;
            }
        } catch (err) {
            msg.innerHTML = `<span class="text-red-600">❌ ${t('network_error')}</span>`;
        }
    });

    // ========== MY MACHINERY ==========
    async function loadMyMachinery() {
        const container = document.getElementById('myMachineryList');
        container.innerHTML = `<p class="text-gray-500">${t('loading')}</p>`;
        try {
            const res = await fetch('/api/machinery/mine');
            if (!res.ok) {
                container.innerHTML = `<p class="text-red-500">Error ${res.status}</p>`;
                return;
            }
            const data = await res.json();
            if (data.length === 0) {
                container.innerHTML = `<p class="text-gray-500">${t('no_machinery')}</p>`;
                return;
            }
            container.innerHTML = data.map(m => `
                <div class="border p-3 rounded-lg bg-gray-50 flex justify-between items-center">
                    <div>
                        <p class="font-bold">${m.name}</p>
                        <p class="text-sm text-gray-600">${m.category} | ₹${m.rental_price_per_day}/day</p>
                        <p class="text-xs ${m.availability ? 'text-green-600' : 'text-red-600'}">${m.availability ? t('available') : t('unavailable')}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="alert('Edit feature coming soon')" class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded">${t('edit')}</button>
                        <button onclick="alert('Delete feature coming soon')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded">${t('delete')}</button>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            container.innerHTML = `<p class="text-red-500">${t('network_error')}</p>`;
        }
    }

    // ========== OWNER BOOKINGS ==========
    async function loadOwnerBookings() {
        const res = await fetch('/api/machinery/bookings');
        const data = await res.json();
        const container = document.getElementById('ownerBookings');
        if (data.length === 0) {
            container.innerHTML = `<p class="text-gray-500">${t('no_booking_requests')}</p>`;
            return;
        }
        container.innerHTML = data.map(b => `
            <div class="border p-3 rounded-lg bg-gray-50">
                <p class="font-bold">${b.machinery_name}</p>
                <p class="text-sm">${b.start_date} to ${b.end_date} | ₹${b.total_price}</p>
                <p class="text-xs font-bold ${b.status === 'pending' ? 'text-yellow-600' : 'text-green-600'}">${b.status}</p>
                ${b.status === 'pending' ? `
                    <div class="mt-2 flex gap-2">
                        <button onclick="respondBooking(${b.id}, 'accept')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm transition">${t('accept')}</button>
                        <button onclick="respondBooking(${b.id}, 'reject')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">${t('reject')}</button>
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    async function respondBooking(id, action) {
        const res = await fetch(`/api/machinery/bookings/${id}/respond`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action})
        });
        const data = await res.json();
        alert(data.message || data.error);
        loadOwnerBookings();
    }

    // ========== ON LOAD ==========
    window.onload = () => {
        loadUser();
        loadOwnerBookings();
        loadMyMachinery();
    };
</script>
{% endblock %}
